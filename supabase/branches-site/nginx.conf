# Nginx server block for branches.hilotcenter.cloud
# Place this in /etc/nginx/sites-available/branches.hilotcenter.cloud
# then: ln -s /etc/nginx/sites-available/branches.hilotcenter.cloud /etc/nginx/sites-enabled/
# then: nginx -t && systemctl reload nginx

server {
  listen 80;
  server_name branches.hilotcenter.cloud;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name branches.hilotcenter.cloud;

  ssl_certificate /etc/letsencrypt/live/branches.hilotcenter.cloud/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/branches.hilotcenter.cloud/privkey.pem;

  root /var/www/branches.hilotcenter.cloud;
  index index.html;

  # ── Caching ──
  # Never cache config.js — it holds live keys
  location = /config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    expires off;
  }

  location ~* \.(css|svg|png|jpg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  # ── Security headers ──

  # Force HTTPS for 1 year, include subdomains
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Prevent clickjacking — no iframes allowed
  add_header X-Frame-Options "DENY" always;

  # Prevent MIME-type sniffing
  add_header X-Content-Type-Options "nosniff" always;

  # Limit referrer info sent to third parties
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Disable unused browser features
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  # Content Security Policy
  # - Scripts: only from self (config.js + inline script in index.html)
  # - Connects: only to Supabase backend
  # - Images: self + https (logo from Supabase Storage)
  # - Styles: only self (style.css)
  add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' https: data:; connect-src 'self' https://db.hilotcenter.cloud; font-src 'self'; base-uri 'self'; form-action 'none';" always;

  # Hide nginx version from error pages
  server_tokens off;
}
