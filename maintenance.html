<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Maintenance — Hilot Center</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #f8fafc;
      padding: 24px;
      overflow: hidden;
    }

    /* Background glow blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
    }
    .blob-1 { width: 400px; height: 400px; background: #6366f1; top: -100px; left: -100px; }
    .blob-2 { width: 300px; height: 300px; background: #10b981; bottom: -80px; right: -80px; }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 32px 64px rgba(0,0,0,0.4);
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .icon-wrap svg {
      width: 36px;
      height: 36px;
      color: #818cf8;
      animation: spin 3s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #818cf8;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(22px, 5vw, 28px);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: #f1f5f9;
      margin-bottom: 12px;
    }

    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, #6366f1, #10b981);
      border-radius: 2px;
      margin: 0 auto 32px;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 10px;
      text-align: left;
    }

    .info-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16,185,129,0.2);
      flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(16,185,129,0.2); }
      50% { box-shadow: 0 0 0 6px rgba(16,185,129,0.1); }
    }

    .info-text {
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      letter-spacing: 0.02em;
    }

    .footer {
      margin-top: 32px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #334155;
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="card">
    <div class="icon-wrap">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 11-3.586-3.586l5.654-4.655m5.714-4.23c.07-.65.49-1.236 1.12-1.507l2.094-.87a.75.75 0 00.241-1.208l-1.44-1.44a.75.75 0 00-1.208.241l-.87 2.094c-.27.63-.857 1.05-1.507 1.12l-3.6.36c-.554.055-.95.517-.95 1.076 0 .236.08.464.228.643l3.072 3.697" />
      </svg>
    </div>

    <div class="badge">System Maintenance</div>

    <h1>We'll Be Right Back</h1>

    <p>
      The system is currently undergoing scheduled maintenance.<br />
      We're working to get everything back up as quickly as possible.
    </p>

    <div class="divider"></div>

    <div class="info-row">
      <div class="info-dot"></div>
      <span class="info-text">Maintenance in progress</span>
    </div>
    <div class="info-row">
      <div class="info-dot" style="background:#f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.2);"></div>
      <span class="info-text">Your data is safe — no action needed</span>
    </div>
    <div class="info-row">
      <div class="info-dot" style="background:#6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.2); animation:none;"></div>
      <span class="info-text">Please check back shortly</span>
    </div>

    <div class="footer">Hilot Center &mdash; Portal System</div>
  </div>

</body>
</html>
