name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Create .env file
        run: |
          echo "CAPACITOR_APP_ID=${{ vars.CAPACITOR_APP_ID || 'com.hilotcenter.pos' }}" >> .env
          echo "CAPACITOR_APP_NAME=${{ vars.CAPACITOR_APP_NAME || 'Point-Of-Sales (HC)' }}" >> .env
          echo "CAPACITOR_WEB_DIR=${{ vars.CAPACITOR_WEB_DIR || 'dist' }}" >> .env
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}" >> .env
          echo "VITE_TIME_API_URL=${{ vars.VITE_TIME_API_URL || 'http://srv1550910.hstgr.cloud:3000/api/time' }}" >> .env
          echo "PAYMONGO_SECRET_KEY=${{ secrets.PAYMONGO_SECRET_KEY }}" >> .env

      - name: Build Web App
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate Assets
        run: |
          # Ensure src/assets exists
          mkdir -p src/assets
          
          # Check for icon.png (required for app identity)
          if [ -f "src/assets/icon.png" ]; then
            if [ -f "src/assets/splash.png" ]; then
              echo "Generating icons and splash screen images..."
              npm run cap:assets
            else
              echo "Generating icons only (Lottie JSON will be used for in-app splash screen)..."
              npx @capacitor/assets generate --android --icon src/assets/icon.png
            fi
          else
            echo "::warning ::src/assets/icon.png not found. Skipping native asset generation."
          fi

      - name: Capacitor Add/Sync
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
