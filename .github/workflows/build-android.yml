name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ─────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── 3. Build web app ───────────────────────────────────────────────────
      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      # ── 4. Java & Android SDK ──────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Capacitor — add Android platform ────────────────────────────────
      - name: Add Android platform
        run: npx cap add android
        continue-on-error: true  # already added if android/ is committed

      # ── 6. App icon ────────────────────────────────────────────────────────
      - name: Generate app icon
        if: hashFiles('src/assets/icon.png') != ''
        run: npx @capacitor/assets generate --android --icon src/assets/icon.png

      # ── 7. Capacitor sync ──────────────────────────────────────────────────
      - name: Capacitor sync
        run: npx cap sync android

      # ── 8. Set version in build.gradle ─────────────────────────────────────
      - name: Set app version to 2.0
        run: |
          sed -i 's/versionName "[^"]*"/versionName "2.0"/' android/app/build.gradle
          sed -i 's/versionCode [0-9]*/versionCode 200/' android/app/build.gradle

      # ── 9. Check if keystore secret exists ─────────────────────────────────
      - name: Check keystore secret
        id: keystore_check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      # ── 10. Signing setup ──────────────────────────────────────────────────
      - name: Decode release keystore
        if: steps.keystore_check.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Inject signing config into build.gradle
        if: steps.keystore_check.outputs.has_keystore == 'true'
        run: |
          python3 - <<'EOF'
          import re

          path = "android/app/build.gradle"
          with open(path, "r") as f:
              content = f.read()

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          if "signingConfigs" not in content:
              content = content.replace("    buildTypes {", signing_block + "    buildTypes {", 1)

          content = re.sub(
              r'(release \{)',
              r'\1\n            signingConfig signingConfigs.release',
              content,
              count=1
          )

          with open(path, "w") as f:
              f.write(content)
          EOF

      # ── 11. Build ──────────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK (signed)
        if: steps.keystore_check.outputs.has_keystore == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build debug APK (no keystore)
        if: steps.keystore_check.outputs.has_keystore == 'false'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── 12. Upload artifact ────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HilotCenter-POS-v2.0
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
